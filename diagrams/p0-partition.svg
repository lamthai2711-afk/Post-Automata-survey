<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 165" width="100%" max-width="520" role="img" aria-label="Initial partition P0 diagram"><title>Initial partition P0 diagram</title><style>text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#1e293b}.lbl{font-size:13px}.sm{font-size:12px;fill:#475569}</style><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker></defs><rect x="20" y="30" width="220" height="90" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="130" y="58" text-anchor="middle">F (accept states)</text><text x="130" y="82" text-anchor="middle" class="sm">ε → accepted</text><rect x="280" y="30" width="220" height="90" rx="10" fill="#fee2e2" stroke="#991b1b" stroke-width="1.6"/><text x="390" y="58" text-anchor="middle">Q ∖ F (non-accept)</text><text x="390" y="82" text-anchor="middle" class="sm">ε → rejected</text><text x="260" y="152" text-anchor="middle" class="sm">P₀ = { Q ∖ F, F } — the two groups already differ on ε</text></svg>