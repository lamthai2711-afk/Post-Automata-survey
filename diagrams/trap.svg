<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" width="100%" max-width="560" role="img" aria-label="Trap state diagram"><title>Trap state diagram</title><style>text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#1e293b}.lbl{font-size:13px}.sm{font-size:12px;fill:#475569}</style><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker></defs><circle cx="110" cy="80" r="26" fill="white" stroke="#334155" stroke-width="1.8"/><text x="110" y="85" text-anchor="middle">X</text><circle cx="300" cy="80" r="26" fill="white" stroke="#334155" stroke-width="1.8"/><text x="300" y="85" text-anchor="middle">Y</text><rect x="430" y="54" width="62" height="52" rx="8" fill="#fef2f2" stroke="#991b1b" stroke-width="1.6"/><text x="461" y="84" text-anchor="middle">Trap</text><path d="M 136 80 L 274 80" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/><text x="205.0" y="74.0" text-anchor="middle">a</text><path d="M 300 106 L 430 106" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/><text x="365" y="126" text-anchor="middle">b</text><path d="M 492 106 Q 520 150 462 106" fill="none" stroke="#991b1b" stroke-width="1.6" marker-end="url(#ar)"/><text x="505" y="150" text-anchor="middle" class="sm">a, b</text><text x="260" y="178" text-anchor="middle" class="sm">Missing transitions go to Trap, which loops forever and never accepts</text></svg>