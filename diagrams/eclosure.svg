<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 135" width="100%" max-width="520" role="img" aria-label="Epsilon closure illustration"><title>Epsilon closure illustration</title><style>text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#1e293b}.lbl{font-size:13px}.sm{font-size:12px;fill:#475569}</style><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker></defs><circle cx="80" cy="60" r="26" fill="white" stroke="#334155" stroke-width="1.8"/><text x="80" y="65" text-anchor="middle">q</text><text x="80" y="120" text-anchor="middle" class="sm">No outgoing ε → E-set(q) = {q}</text><circle cx="300" cy="60" r="26" fill="white" stroke="#334155" stroke-width="1.8"/><text x="300" y="65" text-anchor="middle">q</text><circle cx="440" cy="60" r="26" fill="white" stroke="#334155" stroke-width="1.8"/><text x="440" y="65" text-anchor="middle">r</text><path d="M 326 60 L 414 60" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/><text x="370.0" y="54.0" text-anchor="middle">ε</text><text x="370" y="120" text-anchor="middle" class="sm">With q —ε→ r → E-set(q) = {q, r}</text></svg>