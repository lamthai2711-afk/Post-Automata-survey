<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 175" width="100%" max-width="490" role="img" aria-label="Venn diagram for DFA accept rule"><title>Venn diagram for DFA accept rule</title><style>text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#1e293b}.lbl{font-size:13px}.sm{font-size:12px;fill:#475569}</style><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker></defs><circle cx="190" cy="80" r="62" fill="#dbeafe" fill-opacity="0.55" stroke="#334155" stroke-width="1.6"/><circle cx="300" cy="80" r="62" fill="#dcfce7" fill-opacity="0.55" stroke="#334155" stroke-width="1.6"/><text x="150" y="84" text-anchor="middle">S</text><text x="340" y="84" text-anchor="middle">F</text><text x="245" y="84" text-anchor="middle" class="lbl">S ∩ F</text><text x="245" y="160" text-anchor="middle" class="sm">Accept iff S ∩ F ≠ ∅ (non-empty overlap)</text></svg>