<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 258" width="100%" max-width="400" role="img" aria-label="Distinguishability diagram"><title>Distinguishability diagram</title><style>text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#1e293b}.lbl{font-size:13px}.sm{font-size:12px;fill:#475569}</style><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker></defs><circle cx="90" cy="70" r="26" fill="white" stroke="#334155" stroke-width="1.8"/><text x="90" y="75" text-anchor="middle">Sx</text><circle cx="90" cy="170" r="26" fill="white" stroke="#334155" stroke-width="1.8"/><text x="90" y="175" text-anchor="middle">Sy</text><path d="M 40 20 L 90 70" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ar)"/><path d="M 140 20 L 90 70" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ar)"/><path d="M 40 120 L 90 170" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ar)"/><path d="M 140 120 L 90 170" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ar)"/><text x="90" y="225" text-anchor="middle" class="sm">Same in-degree (2 each)</text><path d="M 116 70 L 250 70" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/><text x="183.0" y="64.0" text-anchor="middle">a</text><path d="M 116 170 L 250 170" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/><text x="183.0" y="164.0" text-anchor="middle">a</text><rect x="250" y="44" width="120" height="52" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="310" y="75" text-anchor="middle">Accept</text><rect x="250" y="144" width="120" height="52" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="1.6"/><text x="310" y="175" text-anchor="middle">Trap</text><text x="230" y="245" text-anchor="middle" class="sm">Same past, different future → distinguishable</text></svg>